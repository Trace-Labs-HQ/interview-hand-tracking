[project]
name = "video-assets-api"
version = "0.1.0"
description = "Presigned URLs for video assets"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.40.0,<2",
  "fastapi>=0.116.0,<1",
  "python-dotenv>=1.1.0,<2",
  "uvicorn>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1",
  "pytest>=8.4.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
